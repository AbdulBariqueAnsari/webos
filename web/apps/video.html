<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  video { width: 95%; max-width: 900px; max-height: 80vh; border-radius: 8px; background: #111; }
  .controls { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  input[type="file"] { font-size: 0.85em; color: #aaa; }
</style>
</head>
<body>
<video id="video" controls autoplay></video>
<div class="controls">
  <input type="file" id="file-input" accept="video/*">
</div>

<script>
const video = document.getElementById('video');
const fileInput = document.getElementById('file-input');

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    video.src = URL.createObjectURL(file);
    video.play();
  }
});
</script>
</body>
</html>
